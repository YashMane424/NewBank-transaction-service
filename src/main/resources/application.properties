spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://localhost:5432/newbank_transaction
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: localhost
    port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    root: INFO
    com.newbank: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      transactionServiceCB:
        slidingWindowSize: 50
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      transactionServiceRetry:
        maxAttempts: 3
        waitDuration: 1000
  ratelimiter:
    instances:
      transactionServiceLimiter:
        limitRefreshPeriod: 1m
        limitForPeriod: 60
        timeoutDuration: 5s
